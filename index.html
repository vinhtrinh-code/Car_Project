<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<title>Cabin Light</title>
<style>
:root{
  --c:#00e5ff;            /* current light colour, updated by JS */
  --bg:#07090f;
  --panel:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.09);
  --txt:#e8edf6;
  --mute:#8a93a6;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html{background:var(--bg)}
html,body{height:100%;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;background:
  radial-gradient(40% 50% at 22% 55%, color-mix(in srgb,var(--c) 38%,transparent),transparent 70%),
  radial-gradient(35% 45% at 85% 20%, color-mix(in srgb,var(--c) 18%,transparent),transparent 70%);
  filter:blur(30px);transition:background .4s;z-index:0;opacity:.9;pointer-events:none}
.app{position:relative;z-index:1}
body.off::before{opacity:.15}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:14px;padding:14px 18px 16px}
header{display:flex;align-items:center;gap:14px}
.brand{font-weight:800;font-size:20px;letter-spacing:.5px}
.brand span{color:var(--c);transition:color .3s}
.status{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:#e5484d;box-shadow:0 0 10px #e5484d}
.status.ok{color:var(--txt)} .status.ok .dot{background:#30d158;box-shadow:0 0 10px #30d158}
.status.busy .dot{background:#ffb224;box-shadow:0 0 10px #ffb224;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:14px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:color-mix(in srgb,var(--c) 25%,transparent);border-color:color-mix(in srgb,var(--c) 60%,transparent)}

.main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,.9fr) minmax(360px,1.4fr);gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-height:0;display:flex;flex-direction:column;gap:14px}
.card h3{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);font-weight:700}

/* colour wheel */
.wheelWrap{position:relative;flex:1;display:grid;place-items:center;min-height:0}
#wheel{width:min(100%,46vh);filter:drop-shadow(0 0 22px color-mix(in srgb,var(--c) 45%,transparent));aspect-ratio:1;touch-action:none;cursor:pointer}
.power{position:absolute;width:34%;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 50% 40%, color-mix(in srgb,var(--c) 90%,#fff 10%), color-mix(in srgb,var(--c) 55%,#000));
  box-shadow:0 0 40px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -6px 18px rgba(0,0,0,.35);
  display:grid;place-items:center;transition:all .3s}
.power svg{width:38%;height:38%;stroke:#fff;stroke-width:2.4;fill:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
body.off .power{background:#1a1f2b;box-shadow:inset 0 0 0 2px var(--line)}
body.off .power svg{stroke:var(--mute)}
.hex{text-align:center;font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}

/* sliders */
.slider{display:flex;flex-direction:column;gap:8px}
.slider label{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.slider b{color:var(--txt)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;border-radius:17px;outline:none;
  background:linear-gradient(90deg,#0b0e16,var(--c));border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#speed{background:linear-gradient(90deg,#0b0e16,#9aa4b8)}

.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{aspect-ratio:1.35;border-radius:14px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sw.sel{border-color:#fff}

/* effects */
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px 4px;border-radius:12px;text-align:center;font-weight:700;font-size:14px;color:var(--mute);background:transparent;border:1px solid var(--line);cursor:pointer}
.tab.on{color:var(--txt);background:color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.fx{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow:auto;align-content:start;flex:1;min-height:0}
.fxi{border-radius:14px;padding:10px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.fxi.on{border-color:#fff;background:rgba(255,255,255,.09)}
.fxi .bar{height:12px;border-radius:6px}
.fxi span{font-size:13px;font-weight:600;line-height:1.2}
.anim-jump{animation:jump 1.4s steps(1) infinite}
.anim-fade{animation:fade 3s linear infinite}
.anim-breath{animation:breath 2.4s ease-in-out infinite}
.anim-strobe{animation:strobe .5s steps(1) infinite}
@keyframes jump{0%{filter:hue-rotate(0)}33%{filter:hue-rotate(120deg)}66%{filter:hue-rotate(240deg)}}
@keyframes fade{to{filter:hue-rotate(360deg)}}
@keyframes breath{50%{opacity:.15}}
@keyframes strobe{50%{opacity:0}}

.mic{display:flex;align-items:center;gap:12px}
.meter{flex:1;height:12px;border-radius:6px;background:#0b0e16;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--c);transition:width .05s}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#1b2130;border:1px solid var(--line);padding:12px 20px;border-radius:14px;font-size:15px;transition:transform .3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;display:block}
  header{flex-wrap:wrap;margin-bottom:14px}
  .status{order:3;width:100%}
  .main{display:flex;flex-direction:column}
  .wheelWrap{flex:none;height:min(78vw,340px)}
  #wheel{width:min(78vw,340px)}
  .fx{flex:none;grid-template-columns:repeat(2,1fr);overflow:visible}
}
</style>
</head>
<body class="off">
<div class="app">
  <header>
    <div class="brand">CABIN<span>LIGHT</span></div>
    <div class="status" id="status"><i class="dot"></i><span id="statusTxt">Chưa kết nối</span></div>
    <div class="spacer"></div>
    <button class="btn primary" id="connectBtn">Kết nối đèn</button>
  </header>

  <div class="main">
    <section class="card">
      <h3>Màu sắc</h3>
      <div class="wheelWrap">
        <canvas id="wheel" width="600" height="600"></canvas>
        <button class="power" id="powerBtn" aria-label="Bật/tắt">
          <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
        </button>
      </div>
      <div class="hex" id="hex">RGB 0, 229, 255</div>
    </section>

    <section class="card">
      <h3>Độ sáng &amp; màu nhanh</h3>
      <div class="slider">
        <label>Độ sáng <b id="briVal">100%</b></label>
        <input type="range" id="bri" min="1" max="100" value="100">
      </div>
      <div class="swatches" id="swatches"></div>
      <h3>Nháy theo nhạc (micro)</h3>
      <div class="mic">
        <button class="btn" id="micBtn">Bật</button>
        <div class="meter"><i id="meter"></i></div>
      </div>
    </section>

    <section class="card">
      <h3>Hiệu ứng</h3>
      <div class="tabs" id="tabs"></div>
      <div class="fx" id="fx"></div>
      <div class="slider">
        <label>Tốc độ hiệu ứng <b id="spdVal">50</b></label>
        <input type="range" id="speed" min="0" max="100" value="50">
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== Protocol (ELK-BLEDOM, service FFF0 / write FFF3, 9-byte frames 7E .. EF) ===== */
const SVC = 0xfff0, CHR = 0xfff3;
const cmd = {
  power:on => [0x7e,0x04,0x04,on?1:0,0x00,on?1:0,0xff,0x00,0xef],
  color:(r,g,b) => [0x7e,0x07,0x05,0x03,r,g,b,0x10,0xef],
  bright:v => [0x7e,0x04,0x01,v,0xff,0xff,0xff,0x00,0xef],
  mode:i => [0x7e,0x05,0x03,0x80+i,0x03,0xff,0xff,0x00,0xef],
  speed:v => [0x7e,0x04,0x02,v,0xff,0xff,0xff,0x00,0xef],
};

const EFFECTS = [
  {g:'move',i:7, n:'Nhảy 3 màu', a:'jump',  c:'linear-gradient(90deg,#f00,#0f0,#00f)'},
  {g:'move',i:8, n:'Nhảy 7 màu', a:'jump',  c:'linear-gradient(90deg,#f00,#f80,#ff0,#0f0,#0ff,#00f,#f0f)'},
  {g:'move',i:9, n:'Chuyển mờ 3 màu', a:'fade', c:'linear-gradient(90deg,#f00,#0f0,#00f)'},
  {g:'move',i:10,n:'Chuyển mờ 7 màu', a:'fade', c:'linear-gradient(90deg,#f00,#f80,#ff0,#0f0,#0ff,#00f,#f0f)'},
  {g:'move',i:18,n:'Đỏ ↔ Xanh lá', a:'fade', c:'linear-gradient(90deg,#f00,#0f0)'},
  {g:'move',i:19,n:'Đỏ ↔ Xanh dương', a:'fade', c:'linear-gradient(90deg,#f00,#00f)'},
  {g:'move',i:20,n:'Lá ↔ Dương', a:'fade', c:'linear-gradient(90deg,#0f0,#00f)'},
  {g:'breath',i:11,n:'Thở đỏ', a:'breath', c:'#ff2a2a'},
  {g:'breath',i:12,n:'Thở xanh lá', a:'breath', c:'#2aff5a'},
  {g:'breath',i:13,n:'Thở xanh dương', a:'breath', c:'#2a6bff'},
  {g:'breath',i:14,n:'Thở vàng', a:'breath', c:'#ffd52a'},
  {g:'breath',i:15,n:'Thở xanh ngọc', a:'breath', c:'#2affef'},
  {g:'breath',i:16,n:'Thở tím', a:'breath', c:'#c42aff'},
  {g:'breath',i:17,n:'Thở trắng', a:'breath', c:'#ffffff'},
  {g:'strobe',i:21,n:'Chớp 7 màu', a:'strobe', c:'linear-gradient(90deg,#f00,#f80,#ff0,#0f0,#0ff,#00f,#f0f)'},
  {g:'strobe',i:22,n:'Chớp đỏ', a:'strobe', c:'#ff2a2a'},
  {g:'strobe',i:23,n:'Chớp xanh lá', a:'strobe', c:'#2aff5a'},
  {g:'strobe',i:24,n:'Chớp xanh dương', a:'strobe', c:'#2a6bff'},
  {g:'strobe',i:25,n:'Chớp vàng', a:'strobe', c:'#ffd52a'},
  {g:'strobe',i:26,n:'Chớp xanh ngọc', a:'strobe', c:'#2affef'},
  {g:'strobe',i:27,n:'Chớp tím', a:'strobe', c:'#c42aff'},
  {g:'strobe',i:28,n:'Chớp trắng', a:'strobe', c:'#ffffff'},
];
const TABS = [['move','Chuyển động'],['breath','Hơi thở'],['strobe','Nhấp nháy']];
const SWATCHES = ['#ff0000','#ff6a00','#ffd000','#00ff2a','#00ffd5','#0077ff','#2200ff','#b000ff','#ff00a8','#ff3b6b','#ffb38a','#ffffff'];

/* ===== State ===== */
const S = load() || {on:true,r:0,g:229,b:255,bri:100,spd:50,tab:'move',fx:null};
function load(){try{return JSON.parse(localStorage.getItem('cabinlight'))}catch(e){return null}}
function save(){try{localStorage.setItem('cabinlight',JSON.stringify(S))}catch(e){}}

/* ===== BLE ===== */
let device=null, chr=null, queue=[], busy=false, pendingColor=null;
const $=id=>document.getElementById(id);

function setStatus(t,cls){$('status').className='status '+(cls||'');$('statusTxt').textContent=t;
  $('connectBtn').textContent = cls==='ok' ? 'Ngắt kết nối' : 'Kết nối đèn';}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

async function connect(){
  if(!navigator.bluetooth){toast('Trình duyệt này không hỗ trợ Bluetooth. Hãy mở bằng Chrome.');return}
  try{
    setStatus('Đang tìm đèn…','busy');
    device = await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'ELK-'},{namePrefix:'BLEDOM'},{services:[SVC]}],
      optionalServices:[SVC]});
    device.addEventListener('gattserverdisconnected',onDisconnect);
    await openGatt();
  }catch(e){setStatus('Chưa kết nối');if(e.name!=='NotFoundError')toast('Không kết nối được: '+e.message)}
}
async function openGatt(){
  setStatus('Đang kết nối '+(device.name||'')+'…','busy');
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SVC);
  chr = await svc.getCharacteristic(CHR);
  setStatus('Đã kết nối · '+(device.name||'đèn'),'ok');
  toast('Đã kết nối '+(device.name||'đèn'));
  applyAll();
}
let manualDisconnect=false;
async function onDisconnect(){
  chr=null;
  if(manualDisconnect){manualDisconnect=false;setStatus('Chưa kết nối');return}
  setStatus('Mất kết nối – đang nối lại…','busy');
  for(let k=0;k<5 && device;k++){
    try{await new Promise(r=>setTimeout(r,1500));await openGatt();return}catch(e){}
  }
  setStatus('Mất kết nối – bấm Kết nối đèn');
}
function disconnect(){if(device&&device.gatt.connected){manualDisconnect=true;device.gatt.disconnect()}}

function send(bytes){queue.push(Uint8Array.from(bytes));pump()}
async function pump(){
  if(busy||!chr) { if(!chr) queue=[]; return }
  busy=true;
  while(queue.length && chr){
    const b=queue.shift();
    try{ chr.writeValueWithoutResponse ? await chr.writeValueWithoutResponse(b) : await chr.writeValue(b) }catch(e){}
    await new Promise(r=>setTimeout(r,25));
  }
  busy=false;
}
/* throttle colour while dragging */
function sendColor(){pendingColor=[S.r,S.g,S.b]; if(!sendColor.t){sendColor.t=setTimeout(()=>{sendColor.t=null;
  queue=queue.filter(q=>!(q[2]===5&&q[3]===3)); send(cmd.color(...pendingColor))},45)}}

function applyAll(){
  send(cmd.power(S.on));
  if(S.on){
    if(S.fx!=null){send(cmd.mode(S.fx));send(cmd.speed(S.spd))}
    else send(cmd.color(S.r,S.g,S.b));
    send(cmd.bright(S.bri));
  }
}

/* ===== UI ===== */
function paint(){
  const hex='#'+[S.r,S.g,S.b].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.documentElement.style.setProperty('--c',hex);
  document.body.classList.toggle('off',!S.on);
  $('hex').textContent = S.fx!=null ? 'Đang chạy hiệu ứng' : `RGB ${S.r}, ${S.g}, ${S.b}`;
  $('bri').value=S.bri;$('briVal').textContent=S.bri+'%';
  $('speed').value=S.spd;$('spdVal').textContent=S.spd;
  document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('sel',S.fx==null&&e.dataset.c===hex));
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.g===S.tab));
  renderFx();drawWheel();
}
function renderFx(){
  const box=$('fx');box.innerHTML='';
  EFFECTS.filter(e=>e.g===S.tab).forEach(e=>{
    const d=document.createElement('div');d.className='fxi'+(S.fx===e.i?' on':'');
    d.innerHTML=`<div class="bar anim-${e.a}" style="background:${e.c}"></div><span>${e.n}</span>`;
    d.onclick=()=>{S.fx=e.i;S.on=true;stopMic();send(cmd.power(true));send(cmd.mode(e.i));send(cmd.speed(S.spd));save();paint()};
    box.appendChild(d)});
}
TABS.forEach(([g,n])=>{const b=document.createElement('button');b.className='tab';b.dataset.g=g;b.textContent=n;
  b.onclick=()=>{S.tab=g;save();paint()};$('tabs').appendChild(b)});
SWATCHES.forEach(c=>{const d=document.createElement('div');d.className='sw';d.dataset.c=c;d.style.background=c;
  d.onclick=()=>setRGB(parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16));$('swatches').appendChild(d)});

function setRGB(r,g,b){S.r=r;S.g=g;S.b=b;S.fx=null;if(!S.on){S.on=true;send(cmd.power(true))}sendColor();save();paint()}

/* colour wheel */
const cv=$('wheel'),cx=cv.getContext('2d');
function drawWheel(){
  const W=cv.width,R=W/2,ri=R*.58;cx.clearRect(0,0,W,W);
  for(let a=0;a<360;a+=1){cx.beginPath();cx.moveTo(R,R);
    cx.arc(R,R,R-4,(a-91)*Math.PI/180,(a-89)*Math.PI/180);cx.closePath();
    cx.fillStyle=`hsl(${a},100%,50%)`;cx.fill()}
  const g=cx.createRadialGradient(R,R,ri*.9,R,R,R);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.35,'rgba(255,255,255,0)');
  cx.fillStyle=g;cx.beginPath();cx.arc(R,R,R-4,0,7);cx.fill();
  cx.globalCompositeOperation='destination-out';cx.beginPath();cx.arc(R,R,ri,0,7);cx.fill();cx.globalCompositeOperation='source-over';
  if(S.fx==null){const h=rgb2h(S.r,S.g,S.b),rm=(R+ri)/2-2,ang=(h-90)*Math.PI/180;
    const x=R+rm*Math.cos(ang),y=R+rm*Math.sin(ang);
    cx.beginPath();cx.arc(x,y,(R-ri)/2-6,0,7);cx.lineWidth=8;cx.strokeStyle='#fff';cx.stroke()}
}
function rgb2h(r,g,b){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(!d)return 0;
  let h=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return (h*60+360)%360}
function h2rgb(h){const f=n=>{const k=(n+h/60)%6;return Math.round(255*(1-Math.max(0,Math.min(k,4-k,1))))};return [f(5),f(3),f(1)]}
function pick(ev){const r=cv.getBoundingClientRect(),x=ev.clientX-r.left-r.width/2,y=ev.clientY-r.top-r.height/2;
  const d=Math.hypot(x,y)/(r.width/2);if(d<.5||d>1.05)return false;
  const h=(Math.atan2(y,x)*180/Math.PI+90+360)%360;setRGB(...h2rgb(h));drawWheel();return true}
let drag=false;
cv.addEventListener('pointerdown',e=>{if(pick(e)){drag=true;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(drag)pick(e)});
cv.addEventListener('pointerup',()=>drag=false);

$('powerBtn').onclick=()=>{S.on=!S.on;if(!S.on)stopMic();send(cmd.power(S.on));if(S.on)applyAll();save();paint()};
$('bri').oninput=e=>{S.bri=+e.target.value;$('briVal').textContent=S.bri+'%';
  queue=queue.filter(q=>q[2]!==1);send(cmd.bright(S.bri));save()};
$('bri').onchange=()=>paint();
$('speed').oninput=e=>{S.spd=+e.target.value;$('spdVal').textContent=S.spd;queue=queue.filter(q=>q[2]!==2);send(cmd.speed(S.spd));save()};
$('connectBtn').onclick=()=> (chr? disconnect() : connect());

/* ===== Mic / music mode ===== */
let mic=null,raf=0,hue=0,lastBeat=0,avg=0;
async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ac=new (window.AudioContext||window.webkitAudioContext)();const an=ac.createAnalyser();an.fftSize=1024;
    ac.createMediaStreamSource(stream).connect(an);mic={stream,ac,an,buf:new Uint8Array(an.frequencyBinCount)};
    S.fx=null;S.on=true;send(cmd.power(true));$('micBtn').textContent='Tắt';loop();
  }catch(e){toast('Không mở được micro: '+e.message)}
}
function stopMic(){if(!mic)return;cancelAnimationFrame(raf);mic.stream.getTracks().forEach(t=>t.stop());mic.ac.close();mic=null;
  $('micBtn').textContent='Bật';$('meter').style.width='0'}
let lastSend=0;
function loop(){
  raf=requestAnimationFrame(loop);
  mic.an.getByteFrequencyData(mic.buf);
  let bass=0;for(let i=1;i<12;i++)bass+=mic.buf[i];bass/=11;
  let all=0;for(let i=0;i<mic.buf.length;i++)all+=mic.buf[i];all/=mic.buf.length;
  avg=avg*.92+bass*.08;
  const now=performance.now();
  if(bass>avg*1.25 && bass>60 && now-lastBeat>180){lastBeat=now;hue=(hue+47)%360}
  const lvl=Math.min(1,all/90);$('meter').style.width=(lvl*100)+'%';
  if(now-lastSend>60){lastSend=now;const [r,g,b]=h2rgb(hue);const k=.15+.85*lvl;
    S.r=Math.round(r*k);S.g=Math.round(g*k);S.b=Math.round(b*k);
    queue=queue.filter(q=>!(q[2]===5&&q[3]===3));send(cmd.color(S.r,S.g,S.b));
    document.documentElement.style.setProperty('--c',`rgb(${S.r},${S.g},${S.b})`)}
}
$('micBtn').onclick=()=> mic?stopMic():startMic();

drawWheel();paint();
if(!navigator.bluetooth) setStatus('Hãy mở bằng Chrome để dùng Bluetooth');
</script>
